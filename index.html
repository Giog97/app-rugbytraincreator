<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>Rugby Train Creator</title>
  <meta name="description" content="Crea allenamenti di rugby per U16-U18: temi, esercizi con schema e spiegazione, sedute da 1h30.">
  <meta name="theme-color" content="#14532d">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rugby Train">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="app-header">
    <img class="logo" src="icons/icon-192.png" alt="">
    <div>
      <h1>Rugby Train Creator</h1>
      <div class="sub">Allenamenti U16–U18 · 1h30</div>
    </div>
  </header>

  <main id="view-root"><!-- le viste vengono iniettate qui --></main>

  <nav class="bottom-nav" id="nav-root"></nav>

  <div class="toast" id="toast"></div>

  <!-- script in ordine: config -> db -> catalog -> app -->
  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Registrazione service worker (solo se servito via http/https, non file://)
    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {/* offline non disponibile */});
      });
    }
  </script>
</body>
</html>
